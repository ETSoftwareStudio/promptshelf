[workspace]
resolver = "3"
members = ["crates/promptshelf-core", "crates/promptshelf"]
# The desktop app needs webkit and GTK on Linux; it builds on its own.
exclude = ["app/src-tauri"]

[workspace.package]
version = "0.2.0" # x-release-please-version
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/ETSoftwareStudio/promptshelf"
authors = ["ET Software Studio Inc."]
homepage = "https://github.com/ETSoftwareStudio/promptshelf"
keywords = ["prompts", "llm", "templates", "cli", "git"]
categories = ["command-line-utilities", "development-tools", "text-processing"]

[workspace.dependencies]
promptshelf-core = { path = "crates/promptshelf-core", version = "0.2.0" } # x-release-please-version
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-saphyr = "2.1"
thiserror = "2"
toml = "1.2"
regex = { version = "1.13", default-features = false, features = ["std", "unicode-perl"] }
ratatui = "0.30"
assert_cmd = "2.2"
insta = { version = "1.49", features = ["json", "redactions"] }
tempfile = "3.27"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
