name: App installers

# Builds the desktop app installers and keeps them as workflow artifacts.
# The release workflow calls this with the tag, then uploads the files to the
# GitHub release. A pull request that changes this file or the Tauri config
# runs it as a dry run, so a broken build shows up before a release.
#
# The installers are not signed yet. The macOS app gets an ad-hoc signature
# (bundle.macOS.signingIdentity "-"), so macOS shows "Open Anyway" for it
# instead of saying that the app is damaged.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, for example v0.2.0.
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/app-bundles.yml
      - app/src-tauri/tauri.conf.json

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The repo is public, so macOS jobs use GitHub's runners, never the studio's own Mac.
          # The bundle copies the committed icons/Assets.car, because actool fails here.
          - os: macos
            runs-on: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          - os: windows
            runs-on: windows-latest
            rust-targets: ""
            args: --bundles nsis,msi
          # The oldest supported Ubuntu, so the AppImage runs on older glibc too.
          - os: linux
            runs-on: ubuntu-22.04
            rust-targets: ""
            args: --bundles appimage,deb
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    env:
      TAG: ${{ inputs.tag || 'v0.0.0-dev' }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Install the Tauri build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: app
          node-version: "24"
          cache: true
      - name: Build
        working-directory: app
        run: vp exec tauri build ${{ matrix.args }}
      - name: Name the installers
        run: |
          out="app/src-tauri/target"
          v="$TAG"
          mkdir dist
          case "${{ matrix.os }}" in
            macos)
              cp "$out"/universal-apple-darwin/release/bundle/dmg/*.dmg "dist/PromptShelf-$v-macos-universal.dmg" ;;
            windows)
              cp "$out"/release/bundle/nsis/*-setup.exe "dist/PromptShelf-$v-windows-x64-setup.exe"
              cp "$out"/release/bundle/msi/*.msi "dist/PromptShelf-$v-windows-x64.msi" ;;
            linux)
              cp "$out"/release/bundle/appimage/*.AppImage "dist/PromptShelf-$v-linux-x86_64.AppImage"
              cp "$out"/release/bundle/deb/*.deb "dist/PromptShelf-$v-linux-amd64.deb" ;;
          esac
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
