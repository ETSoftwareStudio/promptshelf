name: App installers

# Builds the desktop app installers and keeps them as workflow artifacts.
# The release workflow calls this with the tag, then uploads the files to the
# GitHub release. A pull request that changes this file or the Tauri config
# runs it as a dry run, so a broken build shows up before a release.
#
# With `sign`, the macOS app gets a Developer ID signature, and Apple notarises
# the app and the disk image. A signed build fails when a signing secret is
# missing. Without `sign`, the app gets an ad-hoc signature
# (bundle.macOS.signingIdentity "-"). To test signing on a branch, start this
# workflow by hand with `sign` on. The Windows and Linux installers are not
# signed.

on:
  workflow_call:
    inputs:
      tag:
        description: The release tag, for example v0.2.0.
        required: true
        type: string
      sign:
        description: Sign and notarise the macOS app.
        type: boolean
        default: false
    secrets:
      MAC_CERTIFICATE:
        required: false
      MAC_CERTIFICATE_PASSWORD:
        required: false
      MAC_SIGNING_IDENTITY:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER:
        required: false
  workflow_dispatch:
    inputs:
      sign:
        description: Sign and notarise the macOS app.
        type: boolean
        default: false
  pull_request:
    paths:
      - .github/workflows/app-bundles.yml
      - app/src-tauri/tauri.conf.json

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  bundle:
    strategy:
      fail-fast: false
      matrix:
        include:
          # The repo is public, so macOS jobs use GitHub's runners, never the studio's own Mac.
          # The bundle copies the committed icons/Assets.car, because actool fails here.
          - os: macos
            runs-on: macos-latest
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
            args: --target universal-apple-darwin --bundles dmg
          - os: windows
            runs-on: windows-latest
            rust-targets: ""
            args: --bundles nsis,msi
          # The oldest supported Ubuntu, so the AppImage runs on older glibc too.
          - os: linux
            runs-on: ubuntu-22.04
            rust-targets: ""
            args: --bundles appimage,deb
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.runs-on }}
    env:
      TAG: ${{ inputs.tag || 'v0.0.0-dev' }}
      APPIMAGE_EXTRACT_AND_RUN: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || github.sha }}
      - name: Install the Tauri build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential file libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: app
          node-version: "24"
          cache: true
      - name: Build
        working-directory: app
        env:
          SIGN: ${{ inputs.sign && matrix.os == 'macos' }}
          MAC_CERTIFICATE: ${{ inputs.sign && secrets.MAC_CERTIFICATE || '' }}
          MAC_CERTIFICATE_PASSWORD: ${{ inputs.sign && secrets.MAC_CERTIFICATE_PASSWORD || '' }}
          MAC_SIGNING_IDENTITY: ${{ inputs.sign && secrets.MAC_SIGNING_IDENTITY || '' }}
          APPLE_API_KEY_P8: ${{ inputs.sign && secrets.APPLE_API_KEY_P8 || '' }}
          APPLE_API_KEY_ID: ${{ inputs.sign && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ inputs.sign && secrets.APPLE_API_ISSUER || '' }}
        run: |
          if [ "$SIGN" = true ]; then
            for name in MAC_CERTIFICATE MAC_CERTIFICATE_PASSWORD MAC_SIGNING_IDENTITY \
              APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER; do
              if [ -z "${!name}" ]; then
                echo "::error::The secret $name is missing, so the app cannot be signed."
                exit 1
              fi
            done
            # Tauri signs with these, then notarises the app with the App Store Connect key.
            # APPLE_SIGNING_IDENTITY replaces the "-" in tauri.conf.json.
            export APPLE_CERTIFICATE="$MAC_CERTIFICATE"
            export APPLE_CERTIFICATE_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            export APPLE_SIGNING_IDENTITY="$MAC_SIGNING_IDENTITY"
            printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/apple-api-key.p8"
            export APPLE_API_KEY="$APPLE_API_KEY_ID" APPLE_API_KEY_PATH="$RUNNER_TEMP/apple-api-key.p8"
          else
            unset APPLE_API_KEY_ID APPLE_API_ISSUER
          fi
          vp exec tauri build ${{ matrix.args }}
          rm -f "$RUNNER_TEMP/apple-api-key.p8"
      # Tauri notarises the app, but not the disk image around it. Gatekeeper rejects an
      # unnotarised disk image that a browser downloaded.
      - name: Notarise the disk image
        if: inputs.sign && matrix.os == 'macos'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          key="$RUNNER_TEMP/notary-key.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          for dmg in app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg; do
            status=$(xcrun notarytool submit "$dmg" --key "$key" --key-id "$APPLE_API_KEY_ID" \
              --issuer "$APPLE_API_ISSUER" --wait --output-format json | jq -r .status)
            if [ "$status" != Accepted ]; then
              echo "::error::Notarisation of $dmg ended as $status."
              exit 1
            fi
            xcrun stapler staple "$dmg"
            spctl -a -t open --context context:primary-signature -v "$dmg"
          done
          rm -f "$key"
      - name: Name the installers
        run: |
          out="app/src-tauri/target"
          v="$TAG"
          mkdir dist
          case "${{ matrix.os }}" in
            macos)
              cp "$out"/universal-apple-darwin/release/bundle/dmg/*.dmg "dist/PromptShelf-$v-macos-universal.dmg" ;;
            windows)
              cp "$out"/release/bundle/nsis/*-setup.exe "dist/PromptShelf-$v-windows-x64-setup.exe"
              cp "$out"/release/bundle/msi/*.msi "dist/PromptShelf-$v-windows-x64.msi" ;;
            linux)
              cp "$out"/release/bundle/appimage/*.AppImage "dist/PromptShelf-$v-linux-x86_64.AppImage"
              cp "$out"/release/bundle/deb/*.deb "dist/PromptShelf-$v-linux-amd64.deb" ;;
          esac
          cd dist
          for f in *; do
            if command -v sha256sum >/dev/null; then
              sha256sum "$f" > "$f.sha256"
            else
              shasum -a 256 "$f" > "$f.sha256"
            fi
          done
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: app-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error
