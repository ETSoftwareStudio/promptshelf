name: Release

# release-please keeps one release PR open on main. Merging it tags the
# release; the jobs below then build and publish in this same run, because a
# tag pushed with GITHUB_TOKEN starts no other workflow.
#
# Publishing to crates.io, npm and Homebrew runs only when the repository
# variable PUBLISH is "true". Until then a release only gets GitHub assets.
#
# The desktop app installers come from app-bundles.yml. When they fail, the
# CLI still publishes: checksums, npm and homebrew need only the CLI builds.

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_BRANCH: release-please--branches--main

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      prs_created: ${{ steps.release.outputs.prs_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The release PR bumps the version in both Cargo.toml files, so both
  # Cargo.lock files must follow, or every `--locked` build fails. Then start CI on it: a PR opened with
  # GITHUB_TOKEN gets no pull_request runs.
  release-pr:
    needs: release-please
    if: needs.release-please.outputs.prs_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_BRANCH }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - name: Update Cargo.lock
        run: |
          cargo update --workspace
          cargo update --workspace --manifest-path app/src-tauri/Cargo.toml
          if ! git diff --quiet Cargo.lock app/src-tauri/Cargo.lock; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -am "build: update the Cargo.lock files for the release"
            git push
          fi
      # main requires the CI and desktop app checks on every pull request.
      - name: Run CI on the release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run ci.yml --ref "$RELEASE_BRANCH"
          gh workflow run desktop.yml --ref "$RELEASE_BRANCH"

  build:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          # The repo is public, so macOS jobs use GitHub's runners, never the studio's own Mac.
          - target: aarch64-apple-darwin
            runs-on: macos-latest
          - target: x86_64-apple-darwin
            runs-on: macos-latest
          - target: x86_64-unknown-linux-musl
            runs-on: ubuntu-latest
          - target: x86_64-pc-windows-msvc
            runs-on: windows-latest
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.runs-on }}
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      TARGET: ${{ matrix.target }}
      GH_TOKEN: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ matrix.target }}
      - name: Install musl
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p promptshelf
      - name: Package
        run: |
          name="promptshelf-${TAG}-${TARGET}"
          mkdir -p "dist/stage"
          ext=""
          [[ "$TARGET" == *windows* ]] && ext=".exe"
          cp "target/$TARGET/release/shelf$ext" "target/$TARGET/release/promptshelf$ext" dist/stage/
          cp LICENSE README.md dist/stage/
          cd dist/stage
          if [[ "$TARGET" == *windows* ]]; then
            archive="$name.zip"
            tar -a -cf "../$archive" -- *
          else
            archive="$name.tar.gz"
            tar -czf "../$archive" -- *
          fi
          cd ..
          if command -v sha256sum >/dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          gh release upload "$TAG" "$archive" "$archive.sha256" --clobber
      - name: Clean up
        if: always()
        run: rm -rf dist target/"$TARGET"/release

  app:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/app-bundles.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
      sign: true
    # Only the macOS signing secrets. Without them, the macOS installer fails and the tap keeps
    # its old cask.
    secrets:
      MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
      MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
      MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}

  # Uploads the installers that built, so a failed macOS build does not hold back the others.
  app-upload:
    needs: [release-please, app]
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: app-*
          path: dist
          merge-multiple: true
      - name: Upload the installers
        run: |
          shopt -s nullglob
          files=(dist/*)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No app installer built."
            exit 1
          fi
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" "${files[@]}" --clobber

  checksums:
    needs: [release-please, build, app-upload]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Collect checksums
        run: |
          gh release download "$TAG" -R "$GITHUB_REPOSITORY" -p '*.sha256' -D sums
          cat sums/*.sha256 | sort -k2 > checksums.txt
          cat checksums.txt
          gh release upload "$TAG" -R "$GITHUB_REPOSITORY" checksums.txt --clobber

  crates-io:
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true' && vars.PUBLISH == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      # Trusted publishing: a short-lived token from GitHub's OIDC identity.
      - uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
        id: auth
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          cargo publish --locked -p promptshelf-core
          cargo publish --locked -p promptshelf

  npm:
    needs: [release-please, checksums]
    if: ${{ !cancelled() && needs.checksums.result == 'success' && vars.PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Stamp checksums
        run: |
          gh release download "$TAG" -p checksums.txt
          node npm/scripts/stamp.mjs "${TAG#v}" checksums.txt
          cp LICENSE README.md npm/promptshelf/
      # Trusted publishing with provenance: no npm token is stored.
      - name: Publish
        working-directory: npm/promptshelf
        run: npm publish --provenance --access public

  homebrew:
    needs: [release-please, checksums]
    if: ${{ !cancelled() && needs.checksums.result == 'success' && vars.PUBLISH == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag_name }}
      GH_TOKEN: ${{ github.token }}
      TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - name: Update the tap
        if: env.TAP_TOKEN != ''
        run: |
          gh release download "$TAG" -p checksums.txt
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/ETSoftwareStudio/homebrew-tap.git" tap
          mkdir -p tap/Formula tap/Casks
          node packaging/homebrew/render.mjs "${TAG#v}" checksums.txt > tap/Formula/promptshelf.rb
          # The cask follows only when the macOS app built.
          if grep -q "PromptShelf-${TAG}-macos-universal.dmg" checksums.txt; then
            node packaging/homebrew/render-cask.mjs "${TAG#v}" checksums.txt > tap/Casks/promptshelf-app.rb
          fi
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula Casks
          git commit -m "promptshelf ${TAG#v}"
          git push
