<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
/* Prompt library · Margin · full mockup for validation. Every colour is OKLCH. SF Pro / New York / SF Mono on a Mac; Source Serif 4 stands in for New York elsewhere. */

/* ---------- validation chrome (uses host theme, with fallbacks) ---------- */
.top { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin-bottom: 8px; }
.tabs { display: flex; flex-wrap: wrap; gap: 4px; flex: 1; }
.tabs button, .mode button { font: 500 12px var(--font-sans, system-ui, sans-serif); padding: 4px 9px; border-radius: 7px; cursor: pointer;
  border: 1px solid var(--border, oklch(85% 0.005 265)); background: transparent; color: var(--muted-foreground, oklch(45% 0.01 265)); }
.tabs button.on, .mode button.on { background: var(--primary, oklch(30% 0.02 265)); color: var(--primary-foreground, oklch(98% 0 0)); border-color: transparent; }
.mode { display: flex; gap: 4px; }
.note { margin: 0 0 10px; min-height: 36px; font-size: 12.5px; line-height: 1.45; color: var(--muted-foreground, oklch(45% 0.01 265)); max-width: 80ch; }
.note b { color: var(--foreground, oklch(20% 0.01 265)); }
.note code { font-family: var(--font-mono, ui-monospace, monospace); font-size: 11.5px; }
.stage { position: relative; height: 500px; }
[data-go] { cursor: pointer; }

/* ---------- tokens ---------- */
.light { --ground: oklch(99.4% 0.002 265); --side: oklch(95.6% 0.01 265); --side-sel: oklch(89.5% 0.022 255);
  --ink: oklch(22% 0.014 265); --ink2: oklch(47% 0.014 265); --ink3: oklch(55% 0.012 265); --edge: oklch(20% 0.02 265 / 0.16); --rule: oklch(91% 0.006 265);
  --btn: oklch(99.5% 0 0); --accent: oklch(47% 0.15 255); --on-accent: oklch(99% 0.005 255); --link: oklch(47% 0.15 255); --badge: oklch(47% 0.15 255);
  --c: oklch(52% 0.17 355); --c-bg: oklch(94% 0.04 355); --c-ink: oklch(36% 0.12 355);
  --g: oklch(48% 0.11 158); --g-bg: oklch(93% 0.05 158); --g-ink: oklch(31% 0.08 158); --chip-ink: oklch(99% 0 0);
  --ok: oklch(50% 0.12 155); --warn: oklch(55% 0.14 65); --warn-bg: oklch(95.5% 0.05 80); --warn-ink: oklch(35% 0.08 65);
  --group: oklch(97.2% 0.005 265); --pin: oklch(56% 0.17 35); --tog: oklch(47% 0.15 255); --seg: oklch(93% 0.006 265);
  --ins: oklch(92% 0.05 255); --ins-line: oklch(50% 0.15 255); --del: oklch(55% 0.17 25);
  --dim: oklch(20% 0.02 265 / 0.18); --sheet: oklch(99.6% 0.002 265); --bubble: oklch(94% 0.03 255); --menu: oklch(98.5% 0.003 265);
  --wall-a: oklch(78% 0.07 255); --wall-b: oklch(87% 0.06 330); --mbar: oklch(97% 0.008 265 / 0.78); --mbar-sel: oklch(86% 0.02 255);
  --term: oklch(98.6% 0.004 90); --term-bar: oklch(94.5% 0.006 90); --term-sel: oklch(92% 0.03 255); }
.dark { --ground: oklch(19.5% 0.008 265); --side: oklch(24% 0.012 265); --side-sel: oklch(31% 0.03 255);
  --ink: oklch(94% 0.006 265); --ink2: oklch(72% 0.012 265); --ink3: oklch(66% 0.012 265); --edge: oklch(100% 0 0 / 0.12); --rule: oklch(29% 0.01 265);
  --btn: oklch(30% 0.01 265); --accent: oklch(51% 0.16 255); --on-accent: oklch(99% 0.005 255); --link: oklch(78% 0.1 255); --badge: oklch(58% 0.15 255);
  --c: oklch(76% 0.13 355); --c-bg: oklch(66% 0.14 355 / 0.24); --c-ink: oklch(92% 0.05 355);
  --g: oklch(76% 0.12 158); --g-bg: oklch(68% 0.12 158 / 0.22); --g-ink: oklch(91% 0.07 158); --chip-ink: oklch(18% 0.01 265);
  --ok: oklch(76% 0.13 155); --warn: oklch(80% 0.13 75); --warn-bg: oklch(75% 0.13 75 / 0.14); --warn-ink: oklch(90% 0.08 80);
  --group: oklch(23.5% 0.009 265); --pin: oklch(74% 0.14 45); --tog: oklch(58% 0.15 255); --seg: oklch(27% 0.01 265);
  --ins: oklch(62% 0.12 255 / 0.25); --ins-line: oklch(75% 0.12 255); --del: oklch(72% 0.14 25);
  --dim: oklch(5% 0.01 265 / 0.45); --sheet: oklch(25% 0.01 265); --bubble: oklch(33% 0.05 255); --menu: oklch(27% 0.01 265);
  --wall-a: oklch(31% 0.07 265); --wall-b: oklch(24% 0.06 310); --mbar: oklch(20% 0.01 265 / 0.6); --mbar-sel: oklch(38% 0.03 255);
  --term: oklch(16.5% 0.008 265); --term-bar: oklch(22% 0.01 265); --term-sel: oklch(30% 0.05 255); }

/* ---------- shared native pieces ---------- */
.win { font: 12.5px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  color: var(--ink); background: var(--ground); border-radius: 12px; overflow: hidden; position: relative;
  box-shadow: 0 0 0 0.5px var(--edge), 0 18px 40px -18px oklch(12% 0.02 260 / 0.5); }
.win *, .sheet * { box-sizing: border-box; }
.i { width: 15px; height: 15px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.i.s { width: 12px; height: 12px; }
.lights { display: flex; gap: 8px; }
.lights i { width: 12px; height: 12px; border-radius: 50%; }
.lights i:nth-child(1) { background: oklch(68% 0.2 27); } .lights i:nth-child(2) { background: oklch(83% 0.16 85); } .lights i:nth-child(3) { background: oklch(73% 0.18 148); }
.btn { height: 28px; padding: 0 11px; border-radius: 14px; display: inline-flex; align-items: center; gap: 6px; background: var(--btn); color: var(--ink);
  font: 500 12.5px -apple-system, system-ui, sans-serif; box-shadow: inset 0 0 0 0.5px var(--edge), 0 1px 2px oklch(10% 0 0 / 0.06); white-space: nowrap; }
.btn.icon { width: 32px; padding: 0; justify-content: center; }
.btn.sm { height: 22px; padding: 0 8px; font-size: 11.5px; border-radius: 11px; }
.btn.primary { background: var(--accent); color: var(--on-accent); box-shadow: 0 1px 2px oklch(10% 0 0 / 0.12); }
.btn.pressed { background: var(--side-sel); color: var(--link); }
.badge { min-width: 18px; padding: 0 6px; border-radius: 9px; font-size: 11px; font-weight: 600; text-align: center; line-height: 17px; background: var(--badge); color: var(--on-accent); }
.kbd { font-size: 11.5px; color: var(--ink3); }
.mono, code { font-family: "SF Mono", ui-monospace, Menlo, monospace; font-size: 11.5px; }

/* prompt prose, values tinted by source */
.prose { font-family: "New York", "Source Serif 4", ui-serif, Georgia, serif; font-size: 15.5px; line-height: 1.7; margin: 0; }
.v { border-radius: 3px; padding: 1px 3px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
.v.c { background: var(--c-bg); color: var(--c-ink); } .v.g { background: var(--g-bg); color: var(--g-ink); }
.v.ask { white-space: nowrap; outline: 1px dashed var(--ink2); outline-offset: -1px; padding: 1px 7px; }
sup { font: 600 10px -apple-system, system-ui, sans-serif; margin-left: 1px; }
sup.c { color: var(--c); } sup.g { color: var(--g); } sup.a { color: var(--link); }
.notes { margin-top: 12px; padding-top: 9px; border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--ink2); display: grid; grid-template-columns: 14px 1fr; gap: 5px 7px; align-items: center; }
.notes b { font-weight: 600; }
.nn { width: 14px; height: 14px; border-radius: 50%; display: inline-grid; place-items: center; font-size: 9.5px; font-weight: 600; color: var(--chip-ink); }
.nn.c { background: var(--c); } .nn.g { background: var(--g); } .nn.a { background: var(--link); }
.choice { display: flex; gap: 5px; flex-wrap: wrap; }
mark.flag { background: var(--warn-bg); color: var(--warn-ink); box-shadow: inset 0 -1.5px 0 var(--warn); border-radius: 2px; padding: 0 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
del { color: var(--del); text-decoration-thickness: 1.5px; }
ins { text-decoration: none; background: var(--ins); box-shadow: inset 0 -1.5px 0 var(--ins-line); border-radius: 2px; padding: 0 2px; box-decoration-break: clone; -webkit-box-decoration-break: clone; }

/* ---------- library window ---------- */
.lib { display: grid; grid-template-columns: 176px 200px 1fr; height: 500px; }
.side { margin: 8px 0 8px 8px; border-radius: 14px; background: var(--side); padding: 12px 8px; box-shadow: inset 0 0 0 0.5px var(--edge); display: flex; flex-direction: column; }
.side .lights { padding: 0 6px 12px; }
.sh { font-size: 11px; font-weight: 600; color: var(--ink3); padding: 10px 8px 4px; }
.sh.first { padding-top: 2px; }
.si { display: flex; align-items: center; gap: 8px; padding: 4px 8px; border-radius: 7px; white-space: nowrap; }
.si > span:first-of-type { overflow: hidden; text-overflow: ellipsis; }
.si .i { color: var(--link); } .si .i.p { color: var(--pin); }
.si .n { margin-left: auto; font-size: 11.5px; color: var(--ink3); }
.si.on { background: var(--side-sel); font-weight: 500; }
.sync { margin-top: auto; padding: 8px 8px 0; border-top: 1px solid var(--rule); font-size: 11px; color: var(--ink2); display: flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.sync .dot.off { background: var(--ink3); }
.si .ld { width: 6px; height: 6px; border-radius: 50%; background: var(--ok); flex: none; margin-left: 2px; }
.si.add, .si.add .i { color: var(--ink2); }
.meta code { font-size: 11px; color: var(--ink); }
.tog.off { background: var(--seg); box-shadow: inset 0 0 0 0.5px var(--edge); }
.tog.off::after { right: auto; left: 1.5px; }
.fr .ico { color: var(--link); }
.fr .always { font-size: 11.5px; color: var(--ink3); }
.tl .lb { float: right; color: var(--ink3); padding-left: 8px; }
.cc { font: 11.5px/1.55 "SF Mono", ui-monospace, Menlo, monospace; padding: 10px 14px; white-space: pre-wrap; overflow: hidden; height: calc(100% - 30px); }
.cc .u { display: block; background: var(--side); border-radius: 4px; padding: 1px 6px; margin: 4px 0; color: var(--ink); }
.cc .t { color: var(--ink); } .cc .t b { font-weight: 600; } .cc .dot { color: var(--ok); } .cc .say { color: var(--ink2); }
.cc .o { color: var(--ink2); display: block; padding-left: 2ch; } .cc .x { color: var(--warn); }
.lh.col { flex-direction: column; align-items: flex-start; justify-content: center; gap: 6px; height: 70px; }
.segm { display: flex; padding: 2px; border-radius: 7px; background: var(--seg); box-shadow: inset 0 0 0 0.5px var(--edge); font-size: 11.5px; }
.segm span { padding: 2px 8px; border-radius: 5px; color: var(--ink2); white-space: nowrap; }
.segm span.on { background: var(--btn); color: var(--ink); font-weight: 500; box-shadow: 0 0 0 0.5px var(--edge), 0 1px 2px oklch(10% 0 0 / 0.12); }
.pst { font-size: 10.5px; font-weight: 600; padding: 0 6px; border-radius: 8px; line-height: 16px; white-space: nowrap; flex: none; }
.pst.ns { background: var(--seg); color: var(--ink2); box-shadow: inset 0 0 0 0.5px var(--edge); }
.pst.cr { background: var(--warn-bg); color: var(--warn-ink); }
.pst.wr { background: var(--ins); color: var(--ink); }
.row.on .pst { background: oklch(100% 0 0 / 0.22); color: var(--on-accent); box-shadow: none; }
.banner { margin: 0 0 12px; padding: 8px 10px; border-radius: 9px; background: var(--warn-bg); color: var(--warn-ink); font-size: 12px; display: flex; gap: 8px; align-items: flex-start; }
.banner .i { color: var(--warn); margin-top: 1px; }
.banner b { font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 3px; margin-top: 10px; font-size: 11.5px; color: var(--ink2); }
.input { padding: 5px 8px; border-radius: 6px; background: var(--btn); box-shadow: inset 0 0 0 0.5px var(--edge), inset 0 1px 2px oklch(10% 0 0 / 0.06); color: var(--ink); font-size: 12.5px; }
.input.area { min-height: 46px; line-height: 1.4; }
.sfoot .fine { margin-right: auto; font-size: 11px; color: var(--ink3); }
.list { display: flex; flex-direction: column; border-right: 1px solid var(--rule); min-width: 0; }
.lh { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 10px 0 16px; flex: none; }
.lh b { font-size: 15px; font-weight: 650; }
.rows { padding: 0 8px; }
.row { padding: 7px 10px; border-radius: 8px; display: grid; grid-template-columns: 1fr auto; gap: 1px 8px; }
.row .t { font-weight: 600; white-space: nowrap; overflow: hidden; display: flex; align-items: center; gap: 5px; min-width: 0; }
.row .t span { overflow: hidden; text-overflow: ellipsis; }
.row .t .i { color: var(--pin); }
.row .w { font-size: 11.5px; color: var(--ink3); }
.row .d { grid-column: 1 / -1; font-size: 12px; color: var(--ink2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 5px; align-items: center; }
.row.on { background: var(--accent); color: var(--on-accent); }
.row.on .w, .row.on .d, .row.on .t .i { color: oklch(92% 0.03 255); }
.detail { display: flex; flex-direction: column; min-width: 0; }
.dh { height: 52px; display: flex; align-items: center; justify-content: flex-end; gap: 7px; padding: 0 12px; flex: none; }
.body { padding: 4px 22px 0; flex: 1; }
h2 { margin: 0; font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
.meta { font-size: 12px; color: var(--ink2); margin: 3px 0 14px; }
.dfoot { display: flex; align-items: center; gap: 7px; padding: 10px 14px 12px; border-top: 1px solid var(--rule); }
.dfoot .note2 { margin-right: auto; white-space: nowrap; font-size: 11.5px; color: var(--ink2); display: inline-flex; align-items: center; gap: 5px; }
.dfoot .note2 .i { color: var(--ok); }
.empty { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 28px; height: 100%; }
.empty .glyph { width: 36px; height: 36px; color: var(--ink3); stroke-width: 1.3; margin-bottom: 10px; }
.empty h4 { margin: 0; font-size: 15px; font-weight: 650; }
.empty p { margin: 5px 0 14px; font-size: 12.5px; color: var(--ink2); max-width: 38ch; }
.empty .acts { display: flex; gap: 7px; flex-wrap: wrap; justify-content: center; }
.empty a { margin-top: 12px; font-size: 12px; color: var(--link); text-decoration: none; font-weight: 500; }

/* ---------- sheets over the window ---------- */
.dim { position: absolute; inset: 0; background: var(--dim); border-radius: 12px; }
.sheet { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); width: 400px; padding: 14px 16px;
  font: 12.5px/1.4 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
  color: var(--ink); background: var(--sheet); border-radius: 13px; box-shadow: 0 0 0 0.5px var(--edge), 0 22px 48px -12px oklch(8% 0.02 265 / 0.5); }
.sheet h3 { margin: 0; font-size: 13.5px; font-weight: 650; }
.sheet .sub { font-size: 11.5px; color: var(--ink2); margin-top: 1px; }
.gh { font-size: 11.5px; font-weight: 600; color: var(--ink2); margin: 12px 0 5px 2px; }
.grp { background: var(--group); border-radius: 9px; box-shadow: inset 0 0 0 0.5px var(--edge); }
.grp.pad { padding: 9px 11px; margin-top: 10px; }
.r { display: flex; gap: 9px; padding: 7px 10px; align-items: flex-start; }
.r + .r { border-top: 1px solid var(--rule); }
.r .tx { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.r .tx > span { font-size: 11.5px; color: var(--ink2); }
.r .tx .l { font-style: normal; }
.r .tx code { font-size: 11px; }
.r .act { margin-left: auto; align-self: center; }
.r.flag { background: var(--warn-bg); }
.st { width: 15px; height: 15px; margin-top: 1px; }
.st.ok { color: var(--ok); } .st.warn { color: var(--warn); } .st.info { color: var(--link); }
.radio { width: 14px; height: 14px; border-radius: 50%; flex: none; margin-top: 1px; box-shadow: inset 0 0 0 1px var(--edge); background: var(--btn); }
.radio.on { background: var(--accent); box-shadow: inset 0 0 0 4px var(--accent), inset 0 0 0 7px oklch(99% 0 0); }
.seg { display: flex; padding: 2px; border-radius: 7px; background: var(--seg); box-shadow: inset 0 0 0 0.5px var(--edge); }
.seg span { flex: 1; text-align: center; padding: 3px 0; border-radius: 5px; font-size: 11.5px; color: var(--ink2); }
.seg span.on { background: var(--btn); color: var(--ink); font-weight: 500; box-shadow: 0 0 0 0.5px var(--edge), 0 1px 2px oklch(10% 0 0 / 0.12); }
.chk { display: flex; align-items: center; gap: 7px; font-size: 11.5px; }
.box { width: 14px; height: 14px; border-radius: 4px; flex: none; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--edge); background: var(--btn); }
.box.on { background: var(--accent); box-shadow: none; color: var(--on-accent); }
.box .i { width: 10px; height: 10px; stroke-width: 2.4; }
.sfoot { display: flex; align-items: center; justify-content: flex-end; gap: 7px; margin-top: 12px; }
.sfoot .grow { margin-right: auto; }
.thread { margin-top: 10px; padding: 9px 10px; border-radius: 9px; background: var(--side); font-size: 11.5px; color: var(--ink2); display: grid; gap: 6px; }
.thread b { color: var(--ink); font-weight: 600; margin-right: 3px; }
.thread code { font-size: 10.5px; }
.out { margin: 8px 0 0 24px; padding: 8px 10px; border-radius: 11px 11px 3px 11px; background: var(--bubble); color: var(--ink); font-size: 12px; line-height: 1.45; }
.att { display: inline-flex; align-items: center; gap: 5px; margin-top: 6px; padding: 2px 7px; border-radius: 6px; background: var(--btn); box-shadow: inset 0 0 0 0.5px var(--edge); font-size: 11px; color: var(--ink2); }
.pop { height: 22px; padding: 0 6px 0 9px; border-radius: 6px; background: var(--btn); box-shadow: inset 0 0 0 0.5px var(--edge), 0 1px 1.5px oklch(10% 0 0 / 0.06); display: inline-flex; align-items: center; gap: 5px; color: var(--ink); font-size: 12px; white-space: nowrap; }
.pop .i { width: 11px; height: 11px; color: var(--ink2); }

/* ---------- desktop (menu bar, settings, terminal) ---------- */
.desk { position: relative; height: 500px; border-radius: 12px; overflow: hidden; background: linear-gradient(155deg in oklch, var(--wall-a), var(--wall-b)); }
.mbar { height: 26px; display: flex; justify-content: flex-end; align-items: center; gap: 16px; padding: 0 14px; background: var(--mbar);
  font: 500 12.5px -apple-system, system-ui, sans-serif; color: var(--ink); }
.mbar .app { padding: 2px 7px; border-radius: 5px; background: var(--mbar-sel); display: inline-flex; }
.mbp { position: absolute; right: 64px; top: 32px; width: 340px; padding: 8px; border-radius: 13px; }
.ph { display: flex; align-items: center; gap: 6px; padding: 2px 4px 8px; }
.ph .back { color: var(--link); display: inline-flex; align-items: center; gap: 2px; font-size: 12px; }
.ph .t { font-weight: 650; margin: 0 auto 0 4px; }
.search { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 9px; border-radius: 8px; background: var(--side); color: var(--ink3); }
.mi { display: flex; align-items: center; gap: 8px; padding: 5px 8px; border-radius: 6px; white-space: nowrap; }
.mi .i { color: var(--ink2); } .mi .i.p { color: var(--pin); }
.mi .kbd, .mi .ctx { margin-left: auto; } .mi .ctx { font-size: 11.5px; color: var(--ink3); }
.mi.on { background: var(--accent); color: var(--on-accent); } .mi.on .i, .mi.on .kbd { color: oklch(92% 0.03 255); }
.mbp .sh { padding: 10px 8px 3px; }
.pbody { padding: 10px; border-radius: 9px; background: var(--group); box-shadow: inset 0 0 0 0.5px var(--edge); }
.pbody .prose { font-size: 14.5px; line-height: 1.66; }
.pfoot { display: flex; align-items: center; gap: 7px; padding: 9px 4px 2px; }
.pfoot .to { margin-right: auto; font-size: 11.5px; color: var(--ink2); display: inline-flex; align-items: center; gap: 3px; white-space: nowrap; }
.pfoot .to b { color: var(--ink); font-weight: 500; }
.hint { font-size: 11px; color: var(--ink3); padding: 6px 4px 0; }
.mft { margin-top: 6px; padding: 7px 8px 2px; border-top: 1px solid var(--rule); font-size: 11.5px; color: var(--ink2); display: flex; justify-content: space-between; }

/* settings */
.set { position: absolute; left: 50%; top: 30px; transform: translateX(-50%); width: 540px; }
.set .bar { position: relative; padding: 10px 14px 8px; border-bottom: 1px solid var(--rule); background: var(--side); }
.set .bar .lights { position: absolute; left: 14px; top: 12px; }
.set .title { text-align: center; font-weight: 600; font-size: 13px; }
.stabs { display: flex; justify-content: center; gap: 4px; margin-top: 8px; }

        '<div class="tl on"><span class="k">1</span>Strict <span class="m">PR re</span>view</div>' +
        '<div class="tl"><span class="k">2</span>Explain like I\'m senior</div>' +
        '<div class="tl"><span class="k">3</span>Coroutine audit<span class="lb">acme</span></div>' +
        '<div class="tl h">Matches</div>' +
        '<div class="tl">&nbsp; <span class="m">PR</span> description from diff</div>' +
        '<div class="tl">&nbsp; <span class="m">Re</span>lease notes from commits</div><div class="tl">&nbsp; <span class="m">PR</span> checklist, mobile<span class="lb">acme</span></div></div>' +
        '<div class="tprev"><div class="hd"><b>Strict PR review</b><span>personal · v7</span></div>' +
        '<p>Review this diff like a strict senior reviewer. Focus on <span class="v c">races in the retry backoff</span><span style="color:var(--c)">¹</span>. Report <span class="v ask">which findings?</span><span style="color:var(--link)">²</span> and skip style nits. The diff is <span class="v g">+214 −37 across 6 files</span><span style="color:var(--g)">³</span>.</p>' +
        '<div class="fn"><span class="c">¹</span><span>conversation · payments-retry, 4 min ago</span><span class="a">²</span><span><span class="sel">blockers only</span> / everything</span><span class="g">³</span><span>git diff --staged</span></div></div></div>' +
        '<div class="tkeys"><b>enter</b> fill · <b>tab</b> next blank · <b>ctrl-s</b> send… · <b>ctrl-p</b> unpin · <b>esc</b> quit</div></div></div>');
    } }
};

/* ---------- wiring ---------- */
var stage = document.getElementById('stage'), note = document.getElementById('note'), tabs = document.getElementById('tabs');
var current = 'library';
Object.keys(S).forEach(function (k) {
  if (S[k].hidden) return;
  var b = document.createElement('button'); b.textContent = S[k].tab; b.dataset.s = k;
  b.onclick = function () { show(k); }; tabs.appendChild(b);
});
function show(k) {
  current = k; stage.innerHTML = S[k].html(); note.innerHTML = S[k].note;
  var tabKey = S[k].parent || k;
  tabs.querySelectorAll('button').forEach(function (b) { b.classList.toggle('on', b.dataset.s === tabKey); });
}
stage.addEventListener('click', function (e) { var t = e.target.closest('[data-go]'); if (t) { e.preventDefault(); show(t.dataset.go); } });
document.querySelectorAll('#mode button').forEach(function (b) {
  b.onclick = function () {
    stage.className = 'stage ' + b.dataset.m;
    document.querySelectorAll('#mode button').forEach(function (x) { x.classList.toggle('on', x === b); });
  };
});
document.querySelector('#mode button[data-m="light"]').classList.add('on');
var order = Object.keys(S).filter(function (k) { return !S[k].hidden; });
document.addEventListener('keydown', function (e) {
  var i = order.indexOf(S[current].parent || current);
  if (e.key === 'ArrowRight') show(order[(i + 1) % order.length]);
  if (e.key === 'ArrowLeft') show(order[(i - 1 + order.length) % order.length]);
});
var h = location.hash.slice(1).split(',');
show(S[h[0]] ? h[0] : 'library');
if (h[1]) document.querySelector('#mode button[data-m="' + h[1] + '"]').click();
</script>
