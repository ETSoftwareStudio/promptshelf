[package]
name = "promptshelf-desktop"
description = "PromptShelf desktop app: library window and tray panel."
version = "0.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/ETSoftwareStudio/promptshelf"
authors = ["ET Software Studio Inc."]
publish = false

[lib]
name = "promptshelf_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
promptshelf-core = { path = "../../crates/promptshelf-core" }
tauri = { version = "2.12", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-global-shortcut = "2.4"
tauri-plugin-single-instance = "2.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.2"

[dev-dependencies]
tempfile = "3.27"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "warn", priority = -1 }
